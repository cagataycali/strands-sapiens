<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Inter,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  
  <rect width="960" height="360" rx="20" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Step 1: Image corpus -->
  <g filter="url(#s1)">
    <rect x="15" y="35" width="185" height="290" rx="16" fill="white" stroke="#D4D4D8"/>
    <rect x="15" y="35" width="185" height="40" rx="16" fill="#F5F3FF"/>
    <text x="107" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">📂 IMAGE LIBRARY</text>
    <rect x="50" y="88" width="70" height="52" rx="6" fill="#E5E7EB" stroke="#D4D4D8"/>
    <rect x="56" y="94" width="70" height="52" rx="6" fill="#F5F5F5" stroke="#D4D4D8"/>
    <circle cx="91" cy="112" r="10" fill="#D4D4D8"/>
    <rect x="83" y="126" width="16" height="16" rx="3" fill="#D4D4D8"/>
    <text x="107" y="172" text-anchor="middle" font-size="14" fill="#52525B" font-weight="500">1,024 images</text>
    <text x="107" y="192" text-anchor="middle" font-size="14" fill="#71717A">of people</text>
    <text x="42" y="225" font-size="12" fill="#A1A1AA" font-family="monospace">person_001.jpg</text>
    <text x="42" y="245" font-size="12" fill="#A1A1AA" font-family="monospace">person_002.jpg</text>
    <text x="42" y="265" font-size="12" fill="#A1A1AA" font-family="monospace">...</text>
    <text x="42" y="285" font-size="12" fill="#A1A1AA" font-family="monospace">person_1024.jpg</text>
  </g>

  <!-- Arrow -->
  <line x1="210" y1="180" x2="248" y2="180" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="246,174 262,180 246,186" fill="#8B5CF6"/>

  <!-- Step 2: Backbone -->
  <g filter="url(#s1)">
    <rect x="268" y="48" width="195" height="264" rx="16" fill="white" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="268" y="48" width="195" height="40" rx="16" fill="#F5F3FF"/>
    <text x="365" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#7C3AED">🧠 sapiens_backbone</text>
    <text x="365" y="110" text-anchor="middle" font-size="14" fill="#52525B">0.1B pretrain model</text>
    <text x="365" y="132" text-anchor="middle" font-size="14" fill="#52525B">~50ms/image</text>
    <rect x="305" y="155" width="120" height="52" rx="8" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="365" y="179" text-anchor="middle" font-size="14" font-weight="600" fill="#7C3AED">[1, C, H', W']</text>
    <text x="365" y="198" text-anchor="middle" font-size="12" fill="#A78BFA">dense features</text>
    <text x="365" y="240" text-anchor="middle" font-size="14" fill="#52525B">GAP → (C,) vector</text>
    <text x="365" y="262" text-anchor="middle" font-size="14" fill="#52525B">L2 normalize</text>
  </g>

  <!-- Arrow -->
  <line x1="473" y1="180" x2="510" y2="180" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="508,174 524,180 508,186" fill="#8B5CF6"/>

  <!-- Step 3: Vector index -->
  <g filter="url(#s1)">
    <rect x="530" y="48" width="190" height="264" rx="16" fill="white" stroke="#D4D4D8"/>
    <rect x="530" y="48" width="190" height="40" rx="16" fill="#ECFEFF"/>
    <text x="625" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#0891B2">📊 VECTOR INDEX</text>
    <rect x="550" y="100" width="150" height="24" rx="5" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="625" y="117" text-anchor="middle" font-size="11" font-family="monospace" fill="#0E7490">[0.23, -0.41, 0.87, ...]</text>
    <rect x="550" y="132" width="150" height="24" rx="5" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="625" y="149" text-anchor="middle" font-size="11" font-family="monospace" fill="#0E7490">[0.15, 0.62, -0.33, ...]</text>
    <rect x="550" y="164" width="150" height="24" rx="5" fill="#ECFEFF" stroke="#A5F3FC"/>
    <text x="625" y="181" text-anchor="middle" font-size="11" font-family="monospace" fill="#0E7490">[0.91, -0.12, 0.44, ...]</text>
    <text x="625" y="215" text-anchor="middle" font-size="14" fill="#52525B">cosine similarity</text>
    <text x="625" y="240" text-anchor="middle" font-size="14" fill="#52525B">ranked retrieval</text>
    <text x="625" y="272" text-anchor="middle" font-size="13" fill="#A1A1AA" font-weight="500">FAISS / NumPy</text>
  </g>

  <!-- Arrow -->
  <line x1="730" y1="180" x2="767" y2="180" stroke="#22C55E" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="765,174 781,180 765,186" fill="#22C55E"/>

  <!-- Step 4: Results -->
  <g filter="url(#s1)">
    <rect x="787" y="35" width="160" height="290" rx="16" fill="white" stroke="#D4D4D8"/>
    <rect x="787" y="35" width="160" height="40" rx="16" fill="#F0FDF4"/>
    <text x="867" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#16A34A">🏆 TOP MATCHES</text>
    <rect x="800" y="88" width="134" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="812" y="112" font-size="14" font-weight="700" fill="#166534">0.987</text>
    <text x="856" y="112" font-size="13" fill="#52525B">person_042</text>
    <rect x="800" y="134" width="134" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="812" y="158" font-size="14" font-weight="700" fill="#166534">0.974</text>
    <text x="856" y="158" font-size="13" fill="#52525B">person_310</text>
    <rect x="800" y="180" width="134" height="38" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
    <text x="812" y="204" font-size="14" font-weight="600" fill="#71717A">0.971</text>
    <text x="856" y="204" font-size="13" fill="#A1A1AA">person_127</text>
    <rect x="800" y="226" width="134" height="38" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
    <text x="812" y="250" font-size="14" font-weight="600" fill="#71717A">0.968</text>
    <text x="856" y="250" font-size="13" fill="#A1A1AA">person_989</text>
    <text x="867" y="296" text-anchor="middle" font-size="13" fill="#71717A">same pose / identity</text>
  </g>
</svg>