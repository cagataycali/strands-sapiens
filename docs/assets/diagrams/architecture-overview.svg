<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,BlinkMacSystemFont,SF Pro Display,Inter,sans-serif">
  <defs>
    <filter id="s1"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/></filter>
  </defs>
  
  <rect width="960" height="560" rx="20" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
  
  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#1A1A1A">Strands Sapiens Architecture</text>

  <!-- Layer 1: Agent -->
  <g filter="url(#s1)">
    <rect x="30" y="60" width="900" height="105" rx="16" fill="white" stroke="#BBF7D0" stroke-width="1.5"/>
    <rect x="30" y="60" width="900" height="38" rx="16" fill="#F0FDF4"/>
    <text x="480" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#16A34A">AGENT / USER LAYER</text>
    <rect x="55" y="112" width="190" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
