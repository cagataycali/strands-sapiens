    <rect x="265" y="112" width="210" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="370" y="136" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">Natural language → tool</text>
    <rect x="495" y="112" width="190" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="590" y="136" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">Direct Python call</text>
    <rect x="705" y="112" width="195" height="38" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
    <text x="802" y="136" text-anchor="middle" font-size="14" fill="#166534" font-weight="600">TOOLS list import</text>
  </g>

  <!-- Arrow -->
