    <text x="358" y="499" text-anchor="middle" font-size="13" fill="#1E40AF" font-weight="600">sapiens.dense.init_model</text>
    <rect x="468" y="475" width="180" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="558" y="499" text-anchor="middle" font-size="13" fill="#1E40AF" font-weight="600">sapiens.pose.Inferencer</text>
    <rect x="668" y="475" width="115" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="725" y="499" text-anchor="middle" font-size="13" fill="#1E40AF" font-weight="600">RTMDet-m</text>
    <rect x="800" y="475" width="115" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="857" y="499" text-anchor="middle" font-size="13" fill="#1E40AF" font-weight="600">SafeTensors</text>
