    <text x="108" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">sapiens_seg</text>
    <rect x="183" y="270" width="130" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="248" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">sapiens_normal</text>
    <rect x="328" y="270" width="130" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="393" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">sapiens_albedo</text>
