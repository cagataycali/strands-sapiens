    <rect x="773" y="270" width="140" height="42" rx="8" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="843" y="296" text-anchor="middle" font-size="13" font-weight="700" fill="#C2410C">sapiens_backbone</text>
    <!-- _common -->
    <rect x="48" y="325" width="865" height="34" rx="8" fill="#FAFAFA" stroke="#E5E7EB"/>
    <text x="480" y="348" text-anchor="middle" font-size="13" fill="#71717A">_common.py → checkpoint_path() · resolve_input() · validate_size() · ok() · err() · ok_with_images()</text>
