[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "strands-sapiens"
version         = "0.1.1"
description     = "Strands @tool wrappers for Meta Sapiens2 — high-res human-centric vision (seg, normal, pose, pointmap, pretrain backbone)"
readme          = "README.md"
requires-python = ">=3.10"
authors         = [{ name = "cagataycali" }]
license         = { text = "Proprietary" }

dependencies = [
  "strands-agents",
  "numpy",
  "opencv-python",
  "pillow",
  "safetensors",
  "tqdm",
  # torch / torchvision are expected to be installed separately (CUDA build).
  # The `sapiens` package (facebookresearch/sapiens2) must also be installed from source.
]

[project.optional-dependencies]
sapiens   = ["sapiens @ git+https://github.com/facebookresearch/sapiens2.git"]
pointmap  = ["open3d"]
dev       = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["strands_sapiens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # covered by formatter
